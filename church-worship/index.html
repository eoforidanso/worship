<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Ambo — the Mass, on screen: the day’s readings, the Order of Mass, hymns and notices, for the projector. Works offline." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installed on a Mac or iPad: its own window, its own name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ambo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ambo</title>
    <style>
      /* The opening screen, shown while the app loads (styles inline: it paints before any CSS file). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Light brightest behind the sign, fading smoothly out; a faint gold warmth around it. */
        background:
          radial-gradient(circle at 50% 42%, rgba(214, 172, 74, 0.09) 0, rgba(214, 172, 74, 0) 34vmax),
          radial-gradient(ellipse 85% 75% at 50% 42%, #1d2f5c 0%, #142246 38%, #0b1022 78%, #070a17 100%);
        color: #f6de96;
        font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
        transition: opacity 0.5s ease;
      }
      /* Soft rays from above, as through a high window: felt more than seen. */
      #splash::before {
        content: '';
        position: absolute;
        inset: -20% -10% 0;
        background: repeating-conic-gradient(
          from 180deg at 50% -10%,
          rgba(246, 222, 150, 0) 0deg,
          rgba(246, 222, 150, 0.022) 2.5deg,
          rgba(246, 222, 150, 0) 5deg 12deg
        );
        -webkit-mask-image: radial-gradient(ellipse 45% 60% at 50% 30%, #000 0, transparent 100%);
        mask-image: radial-gradient(ellipse 45% 60% at 50% 30%, #000 0, transparent 100%);
        pointer-events: none;
      }
      #splash .mark {
        position: relative;
        width: clamp(120px, 12vmax, 152px);
        aspect-ratio: 1;
        animation: splash-in 0.8s ease-out both;
      }
      /* A slow, breathing glow behind the icon. */
      #splash .mark::before {
        content: '';
        position: absolute;
        inset: -45%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(214, 172, 74, 0.32) 0, rgba(214, 172, 74, 0) 65%);
        animation: splash-breathe 7s ease-in-out infinite;
      }
      #splash img {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 22%;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.35));
      }
      #splash .name {
        margin-top: 22px;
        font-size: clamp(48px, 5.2vmax, 57px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        animation: splash-in 0.8s 0.2s ease-out both;
      }
      #splash .tag {
        margin-top: 12px;
        font-size: clamp(19px, 1.9vmax, 21px);
        font-weight: 400;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.14em;
        color: #e2cd8f;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        animation: splash-in 0.8s 0.4s ease-out both;
      }
      /* Only if loading runs long: a thin gold line, gently moving, to say it is on its way. */
      #splash .loading {
        position: relative;
        margin-top: 26px;
        width: 120px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(214, 172, 74, 0.15);
        opacity: 0;
        animation: splash-fade 0.6s 1.6s ease-out forwards;
      }
      #splash .loading::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #d6ac4a, transparent);
        animation: splash-slide 1.8s ease-in-out infinite;
      }
      #splash.ready {
        cursor: pointer;
      }
      #splash.ready .loading {
        animation: none;
        opacity: 0;
        transition: opacity 0.4s;
      }
      #splash .skip {
        position: absolute;
        bottom: max(32px, env(safe-area-inset-bottom));
        font-size: 15px;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.12em;
        color: rgba(226, 205, 143, 0.55);
        opacity: 0;
        transition: opacity 0.8s 0.4s;
      }
      #splash.ready .skip {
        opacity: 1;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-breathe {
        0%,
        100% {
          opacity: 0.65;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash *::before,
        #splash *::after {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="mark"><img src="/icon-512.png" alt="" /></div>
      <div class="name">Ambo</div>
      <div class="tag">The Mass, on Screen</div>
      <div class="loading"></div>
      <div class="skip">Tap or press any key to begin</div>
    </div>
    <script>
      // Never on the projector or the stage screen: those open straight to black.
      ;(function () {
        var s = document.getElementById('splash')
        if (/\/(output|stage)\/?$/.test(location.pathname)) return s.remove()
        var t0 = Date.now()
        var hide = function () {
          if (!s.isConnected || s.classList.contains('gone')) return
          s.classList.add('gone')
          setTimeout(function () {
            s.remove()
          }, 500)
        }
        var HOLD = 10000 // the sign stays for ten seconds…
        // …but once the app is ready, a tap, click or key lets anyone in at once.
        // The key is swallowed so it can't also act in the app (Space = next slide).
        var skip = function (e) {
          e.preventDefault()
          e.stopPropagation()
          off()
          hide()
        }
        var off = function () {
          window.removeEventListener('keydown', skip, true)
          s.removeEventListener('pointerdown', skip)
        }
        // Called once the app has drawn.
        window.__amboReady = function () {
          s.classList.add('ready')
          window.addEventListener('keydown', skip, true)
          s.addEventListener('pointerdown', skip)
          setTimeout(function () {
            off()
            hide()
          }, Math.max(0, HOLD - (Date.now() - t0)))
        }
        setTimeout(function () {
          off()
          hide()
        }, HOLD + 2000) // whatever happens, never stand in the way
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
